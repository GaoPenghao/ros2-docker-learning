controller_manager:
  ros__parameters:
    update_rate: 50 # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

diff_drive_controller:
  ros__parameters:
    use_sim_time: true

    # 关节名（要和 URDF 里的 <ros2_control> 一致）
    left_wheel_names: ["base_to_left_wheel"]
    right_wheel_names: ["base_to_right_wheel"]

    # 轮距和轮半径（要和 URDF 一致）
    wheel_separation: 0.34
    wheel_radius: 0.05

    # 里程计
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    odom_topic: /odom
    open_loop: false
    enable_odom_tf: true

    # 速度限制
    linear:
      x:
        max_velocity: 0.5
        min_velocity: -0.5
    angular:
      z:
        max_velocity: 1.0
        min_velocity: -1.0

    # 速度指令超时（避免失控）
    cmd_vel_timeout: 0.5
